<script>
  // ------------------------------------------------------------
  // PART 1: WHAT IS THE DOM? (in the simplest way possible)
  // ------------------------------------------------------------
  //
  // Imagine your webpage as a family tree. The <html> tag is the
  // grandparent, <body> is a parent, and every <h1>, <p>, <div>
  // inside it are the children. That whole family tree, as JS
  // sees it, is called the DOM (Document Object Model).
  //
  // JavaScript can use the DOM to REACH INTO the page and read
  // or change anything on it - text, colors, even create or
  // delete whole elements.
